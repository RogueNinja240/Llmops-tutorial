name: CD Pipeline

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  AZURE_RESOURCE_GROUP: rg-rag-llmops
  API_APP_NAME: rag-api
  FRONTEND_APP_NAME: rag-frontend
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: Build & push images to GHCR
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    timeout-minutes: 30
    outputs:
      sha: ${{ steps.vars.outputs.sha }}
      repo_lower: ${{ steps.vars.outputs.repo_lower }}
    steps:
      - name: Check out the promoted commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve image tags
        id: vars
        run: |
          echo "sha=${{ github.event.workflow_run.head_sha || github.sha }}" >> "$GITHUB_OUTPUT"
          echo "repo_lower=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Build & push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.api
          push: true
          secrets: |
            openai_api_key=${{ secrets.OPENAI_API_KEY }}
          tags: |
            ${{ env.REGISTRY }}/${{ steps.vars.outputs.repo_lower }}/rag-api:${{ steps.vars.outputs.sha }}
            ${{ env.REGISTRY }}/${{ steps.vars.outputs.repo_lower }}/rag-api:latest

      - name: Build & push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.vars.outputs.repo_lower }}/rag-frontend:${{ steps.vars.outputs.sha }}
            ${{ env.REGISTRY }}/${{ steps.vars.outputs.repo_lower }}/rag-frontend:latest

  deploy:
    name: Roll out to Azure Container Apps
    needs: build-and-push
    if: vars.ENABLE_AZURE_DEPLOY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Update API Container App
        run: |
          az containerapp update \
            --name "${{ env.API_APP_NAME }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --image "${{ env.REGISTRY }}/${{ needs.build-and-push.outputs.repo_lower }}/rag-api:${{ needs.build-and-push.outputs.sha }}"

      - name: Update Frontend Container App
        run: |
          FRONTEND_FQDN=$(az containerapp update \
            --name "${{ env.FRONTEND_APP_NAME }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --image "${{ env.REGISTRY }}/${{ needs.build-and-push.outputs.repo_lower }}/rag-frontend:${{ needs.build-and-push.outputs.sha }}" \
            --query properties.configuration.ingress.fqdn \
            -o tsv)
          echo "### Deployed Frontend URL" >> "$GITHUB_STEP_SUMMARY"
          echo "https://${FRONTEND_FQDN}" >> "$GITHUB_STEP_SUMMARY"