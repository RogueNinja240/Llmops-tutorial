[project]
name = "llmops-tutorial"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "RogueNinja240", email = "paulsunil0016@gmail.com" }
]
requires-python = ">=3.13"

dependencies = [
    "chromadb>=1.5.9",
    "dagshub>=0.7.3",
    "deepeval>=4.3.3",
    "fastapi>=0.162.0",
    "guardrails-ai>=0.11.0",
    "guardrails-ai-bias-check>=0.3.1",
    "guardrails-ai-detect-jailbreak>=0.1.6",
    "guardrails-ai-gibberish-text>=0.0.2",
    "guardrails-ai-guardrails-pii>=1.0.8",
    "guardrails-ai-prompt-injection-detector>=0.0.2",
    "guardrails-ai-provenance-embeddings>=0.0.2",
    "guardrails-ai-reading-time>=0.1.0",
    "guardrails-ai-redundant-sentences>=0.1.0",
    "guardrails-ai-relevancy-evaluator>=0.1.0",
    "ipykernel>=7.4.0",
    "ipywidgets>=8.1.9",
    "langchain>=1.4.9",
    "langchain-chroma>=1.1.0",
    "langchain-classic>=1.0.8",
    "langchain-community>=0.4.2",
    "langchain-core>=1.7.6",
    "langchain-openai>=1.7.4",
    "langchain-text-splitters>=1.1.3",
    "langfuse>=5.2.0",
    "langgraph>=1.2.20",
    "mlflow>=3.18.0",
    "python-dotenv>=1.2.4",
    "streamlit>=1.67.0",
]

[project.scripts]
llmops-tutorial = "llmops_tutorial:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app", "src/data", "src/evals", "src/config"]
